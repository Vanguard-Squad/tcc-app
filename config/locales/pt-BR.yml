pt-BR:
  date:
    formats:
      default: "%d/%m/%Y"
      short: "%d de %b"
      long: "%d de %B de %Y"
      weekday: "%A, %-d de %B"
    day_names: [domingo, segunda-feira, terça-feira, quarta-feira, quinta-feira, sexta-feira, sábado]
    abbr_day_names: [dom, seg, ter, qua, qui, sex, sáb]
    month_names: [~, janeiro, fevereiro, março, abril, maio, junho, julho, agosto, setembro, outubro, novembro, dezembro]
    abbr_month_names: [~, jan, fev, mar, abr, mai, jun, jul, ago, set, out, nov, dez]
    order:
      - :day
      - :month
      - :year
  datetime:
    distance_in_words:
      half_a_minute: "meio minuto"
      less_than_x_seconds:
        one: "menos de 1 segundo"
        other: "menos de %{count} segundos"
      x_seconds:
        one: "1 segundo"
        other: "%{count} segundos"
      less_than_x_minutes:
        one: "menos de 1 minuto"
        other: "menos de %{count} minutos"
      x_minutes:
        one: "1 minuto"
        other: "%{count} minutos"
      about_x_hours:
        one: "cerca de 1 hora"
        other: "cerca de %{count} horas"
      x_days:
        one: "1 dia"
        other: "%{count} dias"
      about_x_months:
        one: "cerca de 1 mês"
        other: "cerca de %{count} meses"
      x_months:
        one: "1 mês"
        other: "%{count} meses"
      about_x_years:
        one: "cerca de 1 ano"
        other: "cerca de %{count} anos"
      over_x_years:
        one: "mais de 1 ano"
        other: "mais de %{count} anos"
      almost_x_years:
        one: "quase 1 ano"
        other: "quase %{count} anos"
  time:
    formats:
      default: "%d/%m/%Y %H:%M"
      short: "%d/%m %H:%M"
      long: "%d de %B de %Y %H:%M"

  errors:
    format: "%{attribute} %{message}"
    messages:
      accepted: "precisa ser aceito"
      blank: "não pode ficar em branco"
      confirmation: "não é igual a %{attribute}"
      empty: "não pode ficar vazio"
      equal_to: "precisa ser igual a %{count}"
      even: "precisa ser par"
      exclusion: "não está disponível"
      greater_than: "precisa ser maior que %{count}"
      greater_than_or_equal_to: "precisa ser maior ou igual a %{count}"
      inclusion: "não está incluído na lista"
      invalid: "não é válido"
      less_than: "precisa ser menor que %{count}"
      less_than_or_equal_to: "precisa ser menor ou igual a %{count}"
      model_invalid: "Validação falhou: %{errors}"
      not_a_number: "não é um número"
      not_an_integer: "precisa ser um número inteiro"
      odd: "precisa ser ímpar"
      other_than: "precisa ser diferente de %{count}"
      present: "precisa ficar em branco"
      required: "precisa existir"
      taken: "já está em uso"
      too_long:
        one: "é muito longo (máximo: 1 caractere)"
        other: "é muito longo (máximo: %{count} caracteres)"
      too_short:
        one: "é muito curto (mínimo: 1 caractere)"
        other: "é muito curto (mínimo: %{count} caracteres)"
      wrong_length:
        one: "não tem o tamanho certo (1 caractere)"
        other: "não tem o tamanho certo (%{count} caracteres)"

