services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tcc_rails
    command: bin/rails server -b 0.0.0.0
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgresql://tcc:tcc_dev_password@db:5432/tcc_app_development
    depends_on:
      - db

  db:
    image: postgres:17
    container_name: tcc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tcc_app_development
      POSTGRES_USER: tcc
      POSTGRES_PASSWORD: tcc_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  bundle:
